{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Upload PDF</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-5">

    <h1>Chat with PDF</h1>

    <p class="text-muted">
        Upload one or more PDF files.
    </p>

    <hr>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="mb-3">

            <label for="pdf" class="form-label">
                Select PDF files
            </label>

            <input
                type="file"
                class="form-control"
                id="pdf"
                name="pdf"
                accept=".pdf"
                multiple
                required
            >

        </div>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Upload PDFs
        </button>

    </form>

</div>

</body>

</html>
