{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Ask Questions</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-5">

    <h1>Chat with PDF</h1>

    <p class="text-muted">
        Your PDF has been uploaded successfully.
    </p>

    <hr>

    <form method="POST">

        {% csrf_token %}


        <!-- PDF Selection -->

        <div class="mb-3">

            <label for="pdf" class="form-label">
                Select PDF
            </label>

            <select
                name="pdf"
                id="pdf"
                class="form-select"
                required
            >
               <option value="all">
                 All PDFs   
            </option>
                {% for pdf in pdf_files %}

                    <option value="{{ pdf }}">
                        {{ pdf }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <!-- Question -->

        <div class="mb-3">

            <label for="question" class="form-label">
                Ask a question
            </label>

            <input
                type="text"
                class="form-control"
                id="question"
                name="question"
                placeholder="Ask something about the PDF"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-success"
        >
            Ask Question
        </button>

    </form>


    {% if answer %}

        <div class="mt-4">

            <h4>Answer</h4>

            <div class="alert alert-info">
                {{ answer }}
            </div>

        </div>

    {% endif %}


</div>

</body>

</html>
